<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('index') }}"><span class="logo">♪</span>{{ site_name }}</a>
  {% block topright %}{% endblock %}
  {% if session.admin %}
  <nav class="adm">
    <a href="{{ url_for('admin') }}">Painel</a>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf() }}"><button class="link">Sair</button></form>
  </nav>
  {% endif %}
</header>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for c, m in msgs %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
